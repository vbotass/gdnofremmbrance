<!DOCTYPE html>

            font-family: 'Segoe UI', sans-serif;
            background: #eef2f5;

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            color: #b0b0b0;
            letter-spacing: 4px;
            z-index: 10;
        }
        #info {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(80, 80, 80, 0.6);
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #overlay-box {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 28px 40px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            color: #1e1e1e;
            font-size: 14px;
            line-height: 1.7;
        }
        #overlay-box h2 {
            font-weight: 400;
            font-size: 20px;
            margin: 0 0 14px 0;
            text-align: center;
            letter-spacing: 1px;
        }
        #overlay-box table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        #overlay-box td {
            padding: 5px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        #overlay-box td:first-child {
            color: #555;
            width: 44%;
            font-weight: 500;
        }
        #overlay-box td:last-child {
            color: #222;
        }
        #overlay-box .note {
            margin-top: 14px;
            font-size: 12px;
            color: #999;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }
        @media (max-width:500px) {
            #overlay-box {
                padding: 20px 18px;
                font-size: 13px;
            }
            #overlay-box table {
                font-size: 12px;
            }
        }
        #popup {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 50;
        }
        #popup.show {
            opacity: 1;
            pointer-events: auto;
        }
        #popup-content {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            padding: 30px 34px 24px 34px;
            border-radius: 24px;
            max-width: 380px;

            text-align: center;
            font-size: 17px;
            line-height: 1.8;
            color: #1e1e1e;
            transform: scale(0.92);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: 20px;
        }
        #popup.show #popup-content {
            transform: scale(1);
        }
        #popup-content img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            margin-top: 10px;
        }
        #popup-content .text {
            margin-bottom: 6px;
        }

            padding: 8px 32px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.04);
            color: #555;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            letter-spacing: 2px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        #popup-close-btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }

            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;

            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        }
        #door-ui button {

            left: 0;

            height: 100%;

            cursor: pointer;
            display: none;
        }
        #door-narrative-close-area.show {

        }

            opacity: 1;
            visibility: visible;
        }
        #door-inside-text.fade {
            opacity: 0;
            visibility: hidden;

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2f5);
        scene.fog = new THREE.Fog(0xeef2f5, 28, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(7, 5, 13);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        sun.castShadow = true;

        // 花朵
        function createFlower(color) {
            const group = new THREE.Group();
            const height = 0.4 + Math.random() * 0.8;
            const bend = (Math.random() - 0.5) * 0.15;
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(bend * 0.4, height * 0.4, 0),
                new THREE.Vector3(bend, height * 0.8, 0),
                new THREE.Vector3(bend, height, 0),
            ]);
            const stem = new THREE.Mesh(
                new THREE.TubeGeometry(curve, 6, 0.02, 4, false),
                new THREE.MeshStandardMaterial({ color: 0x5a8a5a, roughness: 0.9 })
            );
            stem.castShadow = true;
            group.add(stem);
            const head = curve.getPoint(1);
            const petalMat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.02,
                side: THREE.DoubleSide,
                emissive: color,
                emissiveIntensity: 0.03,
            });
            for (let i = 0; i < 4 + Math.floor(Math.random() * 2); i++) {
                const a = (i / 4) * Math.PI * 2 + Math.random() * 0.2;
                const p = new THREE.Mesh(new THREE.CircleGeometry(0.08 + Math.random() * 0.04, 5), petalMat);
                const r = 0.1 + Math.random() * 0.04;
                p.position.set(
                    head.x + Math.cos(a) * r,
                    head.y + 0.03 + Math.random() * 0.02,
                    head.z + Math.sin(a) * r
                );
                p.rotation.x = Math.sin(a) * 0.4 + 0.2;
                p.rotation.z = Math.cos(a) * 0.4 + 0.2;
                p.rotation.y = a;
                p.scale.set(1, 0.6 + Math.random() * 0.4, 1);
                group.add(p);
            }
            const center = new THREE.Mesh(
                new THREE.SphereGeometry(0.035, 5, 5),
                new THREE.MeshStandardMaterial({ color: 0xffdd77, emissive: 0xffaa33, emissiveIntensity: 0.1,
                    roughness: 0.3 })
            );
            center.position.set(head.x, head.y + 0.02, head.z);
            group.add(center);
            return group;
        }

        let data = [];
        const count = 350;
        while (data.length < count) {
            for (const d of flowerData) {
                if (data.length < count) data.push({ ...d });
            }
        }

        const flowerGroups = [];
        const container = new THREE.Group();
        scene.add(container);
        data.forEach((d, i) => {
            const a = Math.random() * Math.PI * 2;
            const r = 1.8 + Math.sqrt(Math.random()) * 26;
            const flower = createFlower(d.color || 0xffb3ba);
            flower.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
            flower.rotation.y = Math.random() * Math.PI * 2;
            flower.userData.content = d.content || '';
            flower.userData.image = d.image || '';
            flowerGroups.push(flower);
            container.add(flower);
        });

        // ================================================================
        // 门
        // ================================================================
        const doorGroup = new THREE.Group();
        doorGroup.position.set(0, 0, 0);
        scene.add(doorGroup);

        function plasterTex() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#f5f0eb';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 4000; i++) {
                const x = Math.random() * 256,
                    y = Math.random() * 256,
                    r = Math.random() * 2,
                    a = Math.random() * 0.1;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180,170,160,${a})`;
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 4);
            return tex;
        }
        const tex = plasterTex();
        const frameMat = new THREE.MeshStandardMaterial({ map: tex, color: 0xf0ece6, roughness: 0.85, metalness: 0 });
        const doorMat = new THREE.MeshStandardMaterial({ map: tex, color: 0xf0ece6, roughness: 0.8, metalness: 0 });

        const w = 1.4,
            h = 2.4;
        const pw = 0.12,
            pd = 0.12;

        // 门框
        const left = new THREE.Mesh(new THREE.BoxGeometry(pw, h, pd), frameMat);
        left.position.set(-w / 2 - pw / 2, h / 2, 0);
        left.castShadow = true;
        doorGroup.add(left);
        const right = new THREE.Mesh(new THREE.BoxGeometry(pw, h, pd), frameMat);
        right.position.set(w / 2 + pw / 2, h / 2, 0);
        right.castShadow = true;
        doorGroup.add(right);
        const top = new THREE.Mesh(new THREE.BoxGeometry(w + pw * 2, pw, pd), frameMat);
        top.position.set(0, h + pw / 2, 0);
        top.castShadow = true;
        doorGroup.add(top);
        const bot = new THREE.Mesh(new THREE.BoxGeometry(w + pw * 2, 0.06, pd), frameMat);
        bot.position.set(0, 0.03, 0);
        bot.receiveShadow = true;
        doorGroup.add(bot);

        // 门体
        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), doorMat);
        doorMesh.position.set(0, h / 2, 0.05);
        doorMesh.castShadow = true;
        const pivot = new THREE.Group();
        pivot.position.set(-w / 2 - pw / 2 + 0.01, 0, 0);
        pivot.add(doorMesh);
        doorMesh.position.set(w / 2 + pw / 2 - 0.01, h / 2, 0.05);
        doorGroup.add(pivot);
        const doorState = { pivot, mesh: doorMesh, isOpen: false, targetAngle: 0 };

        // 球体把手
        const knobMat = new THREE.MeshStandardMaterial({
            color: 0xc49a6c,
            roughness: 0.65,
            metalness: 0.35,
        });
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), knobMat);
        knob.position.set(0.55, 0.1, 0.07);
        doorMesh.add(knob);

        const baseMat = new THREE.MeshStandardMaterial({
            color: 0xb08a60,
            roughness: 0.7,
            metalness: 0.3,
        });
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.015, 10), baseMat);
        base.position.set(0.55, 0.1, 0.05);
        base.rotation.x = Math.PI / 2;
        doorMesh.add(base);

        // 告示牌（MC风格，无文字，三条横线）
        const signGroup = new THREE.Group();
        signGroup.position.set(0, 0.75, 0.07);
        doorMesh.add(signGroup);

        const signWoodMat = new THREE.MeshStandardMaterial({
            color: 0xd4c5a0,
            roughness: 0.9,
            metalness: 0,
        });
        const board = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.28, 0.025), signWoodMat);
        board.position.set(0, 0, 0);
        board.castShadow = true;
        signGroup.add(board);

        const darkWoodMat = new THREE.MeshStandardMaterial({
            color: 0x8a7a5a,
            roughness: 0.9,
            metalness: 0,
        });
        const border = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.32, 0.015), darkWoodMat);
        border.position.set(0, 0, -0.015);
        signGroup.add(border);

        const lineMat = new THREE.MeshStandardMaterial({
            color: 0x5a4a3a,
            roughness: 0.9,
            metalness: 0,
        });
        for (const yOff of [-0.07, 0, 0.07]) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.016, 0.005), lineMat);
            line.position.set(0, yOff, 0.017);
            signGroup.add(line);
        }

        // ================================================================
        // 门交互 (距离调远)
        // ================================================================
        const doorUI = document.getElementById('door-ui');
        const inspectBtn = document.getElementById('door-inspect-btn');
        let doorOpened = false;

        function checkDoor() {
            if (doorOpened) { doorUI.classList.remove('show'); return; }
            const dist = camera.position.distanceTo(new THREE.Vector3(0, 1.2, 0));
            // 距离小于 12 时显示UI
            dist < 12 ? doorUI.classList.add('show') : doorUI.classList.remove('show');
        }

        inspectBtn.addEventListener('click', () => {
            document.getElementById('door-narrative').classList.add('show');
            document.getElementById('door-narrative-close-area').classList.add('show');
            doorUI.classList.remove('show');
        });

        const narr = document.getElementById('door-narrative');
        const closeArea = document.getElementById('door-narrative-close-area');

        function closeNarr() {
            narr.classList.remove('show');
            closeArea.classList.remove('show');
            setTimeout(checkDoor, 100);
        }
        closeArea.addEventListener('click', closeNarr);
        document.getElementById('door-close-btn').addEventListener('click', closeNarr);

        const insideText = document.getElementById('door-inside-text');
        let fadeTimer = null;

        document.getElementById('door-open-btn').addEventListener('click', () => {
            doorState.targetAngle = -Math.PI / 2.2;
            doorState.isOpen = true;
            doorOpened = true;

            if (fadeTimer) { clearTimeout(fadeTimer);
                fadeTimer = null; }
            insideText.classList.remove('fade');
            void insideText.offsetWidth;
            insideText.classList.add('show');
            fadeTimer = setTimeout(() => {
                insideText.classList.remove('show');
                insideText.classList.add('fade');
                fadeTimer = null;
            }, 3000);

            closeNarr();
            doorUI.classList.remove('show');
        });

        // ================================================================
        // 点击检测
        // ================================================================
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const clickMeshes = [];
        flowerGroups.forEach(g => {
            g.children.forEach(c => { if (c.isMesh) { c.userData.parent = g;
                    clickMeshes.push(c); } });
        });
        const doorClickables = [];
        doorGroup.children.forEach(c => { if (c.isMesh) doorClickables.push(c); });
        doorState.mesh.children.forEach(c => { if (c.isMesh) doorClickables.push(c); });

        function onDown(e) {
            if (e.touches && e.touches.length >= 2) return;
            const rect = renderer.domElement.getBoundingClientRect();
            const cx = e.clientX || (e.touches && e.touches[0].clientX);
            const cy = e.clientY || (e.touches && e.touches[0].clientY);
            if (cx == null) return;
            pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const hits = raycaster.intersectObjects(clickMeshes);
            if (hits.length) {
                const p = hits[0].object.userData.parent;
                if (p) { showPopup(p.userData.content || '', p.userData.image || ''); return; }
            }
            if (!doorOpened) {
                const dh = raycaster.intersectObjects(doorClickables);
                // 点击门体触发查看的距离为 13
                if (dh.length && camera.position.distanceTo(new THREE.Vector3(0, 1.2, 0)) < 13) {
                    inspectBtn.click();
                }
            }
        }
        renderer.domElement.addEventListener('pointerdown', onDown);

        // ================================================================
        // 弹窗
        // ================================================================
        const popup = document.getElementById('popup');
        const popupText = document.getElementById('popup-text');
        const closeBtn = document.getElementById('popup-close-btn');

        function showPopup(text, img) {
            let html = '';
            if (img) html += `<img src="${img}" />`;
            if (text) html += `<div class="text">${text}</div>`;
            if (!text && !img) html = `<div class="text" style="color:#999;">没有留下字迹</div>`;
            popupText.innerHTML = html;
            popup.classList.add('show');
        }

        closeBtn.addEventListener('click', () => {
            popup.classList.remove('show');
        });

        // ================================================================
        // 操作说明
        // ================================================================
        document.getElementById('overlay').addEventListener('click', (e) => {
            e.target.closest('#overlay-box') || document.getElementById('overlay').classList.add('hidden');
        });

        // ================================================================
        // 触屏滑动
        // ================================================================
        let lastDist = 0,
            startY = 0;
        const touchDist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) { lastDist = touchDist(e.touches);
                startY = (e.touches[0].clientY + e.touches[1].clientY) / 2; }
        }, { passive: true });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 2) return;
            const d = touchDist(e.touches);
            const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            if (Math.abs(d - lastDist) > 8) { lastDist = d; return; }
            const step = (y - startY) * 0.03;
            if (Math.abs(step) > 0.02) {
                const f = new THREE.Vector3(0, 0, -1);
                f.applyQuaternion(camera.quaternion);
                f.y = 0;
                f.normalize();
                camera.position.add(f.clone().multiplyScalar(Math.min(Math.max(step, -1.8), 1.8)));
                controls.target.add(f.clone().multiplyScalar(Math.min(Math.max(step, -1.8), 1.8)));
                controls.update();
                startY = y;
                lastDist = d;
                if (camera.position.y < 0.08) { camera.position.y = 0.08;
                    controls.target.y = 0.08;
                    controls.update(); }
            }
        }, { passive: true });

        // ================================================================
        // 自适应
        // ================================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('loading').style.display = 'none';

        // ================================================================
        // 动画
        // ================================================================
        let clock = new THREE.Clock();

        function animate() {
            const t = clock.getElapsedTime();
            flowerGroups.forEach((g, i) => {
                const o = i * 0.01;
                g.rotation.x = Math.sin(t * 0.6 + o) * 0.002;
                g.rotation.z = Math.cos(t * 0.7 + o * 1.2) * 0.0015;
            });

            const diff = doorState.targetAngle - doorState.pivot.rotation.y;
            if (Math.abs(diff) > 0.001) doorState.pivot.rotation.y += diff * 0.045;
            else doorState.pivot.rotation.y = doorState.targetAngle;

            checkDoor();
            controls.update();
            if (camera.position.y < 0.08) { camera.position.y = 0.08;
                controls.target.y = 0.08;
                controls.update(); }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        console.log('Garden of Remenberance.');
    </script>
</body>
</html>
